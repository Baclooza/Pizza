<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/pizza-styles.css">
    <title>Tony's Not a Front Pizza</title>

    <!-- Favicon -->
    <link rel="icon" href="images/PizzaIcon.jpg">
</head>
<body>
    <div id="main">
        <div id="header">
            <img src="Images/Tony.png" alt="Trustworthy Pizza Guy">
            <h1>Tony's Not a Front Pizza!</h1>
            <h2>We could use a reliable guy like you!</h2>
            <hr>
            <p>The most reputable pizza parlor in town. Visit us for all of your "needs"</p>
            <a id="contact-button" href="#" role="button">Contact Us</a>
        </div>
        <form id="pizza-form" action="#" method="get">
            
            <!-- Contact Info -->
             <fieldset>
                <legend>Contact Info</legend>
                <label for="fname">First Name: </label>
                <input type="text" id="fname" name="fname">

                <label for="lname">Last Name: </label>
                <input type="text" id="lname" name="lname">

                <label for="email">Email: </label>
                <input type="email" id="email" name="email">

             </fieldset>
            <!-- Pickup or Delivery -->
             <fieldset>
                <legend>Select Pickup or Delivery</legend>
                <label for="pickup">
                    <input type="radio" id="pickup" name="method" value="pickup">
                    pickup
                </label>
                <label for="delivery">
                    <input type="radio" id="delivery" name="method" value="delivery">
                    delivery
                </label>
             </fieldset>

            <!-- Select Toppings -->
             <fieldset>
                <legend>Select Toppings</legend>
                <label for="pepperoni">
                    <input type="checkbox" id="pepperoni" name="Toppings[]" value="pepperoni">
                    Pepperoni
                </label>
                <label for="sausage">
                    <input type="checkbox" id="sausage" name="Toppings[]" value="sausage">
                    Sausage
                </label>
                <label for="bacon">
                    <input type="checkbox" id="bacon" name="Toppings[]" value="bacon">
                    Bacon
                </label>
             </fieldset>
            <!-- Select Pizza Size -->
             <fieldset>
                <legend>Select Pizza Size</legend>
                <select id="size" name="size">
                    <option value="none">-- Select a Size --</option>
                    <option value="small">small</option>
                    <option value="medium">medium</option>
                    <option value="large">large</option>
                </select>
             </fieldset>

            <!-- Comment Field -->
             <label for="comment">Comments</label>
             <textarea rows="5" id="comment" name="comment"></textarea>

            <button type="submit" id="order-button">Place Order</button>

            
        </form>
    </div>
</body>
</html>
